<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A very official date request for Jas."
    />
    <meta name="theme-color" content="#fff7ed" />
    <title>Book Jas | Date Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Book Jas home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M12 21s-7-4.35-9.33-8.27C.81 9.6 2.2 5.5 5.82 4.46 8.05 3.82 10.2 4.7 12 6.6c1.8-1.9 3.95-2.78 6.18-2.14 3.62 1.04 5.01 5.14 3.15 8.27C19 16.65 12 21 12 21Z" />
            </svg>
          </span>
          <span>Book Jas</span>
        </a>
        <span class="route-pill">
          <span class="route-dot" aria-hidden="true"></span>
          YOU + JAS
        </span>
      </header>

      <section class="booking-card" aria-live="polite">
        <div class="progress-wrap" aria-label="Booking progress">
          <div class="progress-copy">
            <span id="stepLabel">REQUEST RECEIVED</span>
            <span id="stepCount">01 / 06</span>
          </div>
          <div class="progress-track">
            <span id="progressBar" style="width: 16.67%"></span>
          </div>
        </div>

        <div id="screen" class="screen"></div>
      </section>

      <p class="footer-note">
        Made with unreasonable confidence for dates wherever you are.
      </p>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
